# Supabase CLI config for Fanday on a SHARED Supabase project that other apps also use. This file configures LOCAL development and Edge Function settings only.
# NEVER run `supabase db push`, `db reset` or `config push` against the shared project. Fanday's SQL is applied as PLAIN SQL with execute_sql,
# never apply_migration (that writes to the shared supabase_migrations table); Auth settings are changed by hand in the dashboard.
# This PR does not link the CLI.
project_id = "ywcrzkvwamjchjjkfrve"

[api]
# `fanday` must also be added to the exposed schemas of the shared project (dashboard step), keeping the existing ones.
schemas = ["public", "graphql_public", "fanday"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_teams.sql", "./seed/teams_tz.sql"] # all write to fanday.leagues / fanday.teams only

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "com.bbprojectfactory.fanday://auth/callback",
  "https://fanday.bbprojectfactory.com/auth/callback",
  "http://localhost:5173/**",
]
# Anonymous sign-ins stay OFF: the setting is project-wide and other apps share it. Signed-out Fanday users are
# keyed to a device token (fanday.device_tokens), not to an auth user.
enable_anonymous_sign_ins = false

# JWT verification at the gateway is OFF for these functions: each authenticates itself
# (fanday-delete-account checks the bearer token; fanday-go is a public redirect; fanday-device and fanday-send-link serve signed-out phones;
# fanday-ingest checks FANDAY_INGEST_SECRET). New-style sb_secret keys are not JWTs, so the gateway check must stay off.
[functions.fanday-delete-account]
verify_jwt = false

[functions.fanday-go]
verify_jwt = false

[functions.fanday-ingest]
verify_jwt = false

[functions.fanday-send-link]
verify_jwt = false

[functions.fanday-device]
verify_jwt = false
